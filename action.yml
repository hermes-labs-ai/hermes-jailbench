name: hermes-jailbench
description: >-
  Run the hermes-jailbench jailbreak regression battery against an LLM endpoint
  and fail the job when the bypass rate exceeds a threshold.
branding:
  icon: shield
  color: red

inputs:
  model:
    description: >-
      Model ID. Required for provider "openai-compat" (the endpoint's own ID);
      defaults to the package default for "anthropic".
    required: false
    default: ""
  provider:
    description: 'Target endpoint kind: "anthropic" or "openai-compat".'
    required: false
    default: anthropic
  base-url:
    description: >-
      Endpoint base URL, e.g. http://localhost:11434/v1. Required for
      provider "openai-compat".
    required: false
    default: ""
  api-key:
    description: >-
      API key. Pass a secret, never a literal. Optional for "openai-compat"
      against a local runtime that has no credential.
    required: false
    default: ""
  fail-on-bypass:
    description: >-
      Bypass-rate threshold as a percentage, 0-100. The job fails when the
      measured rate exceeds it. Set to an empty string to report without gating.
    required: false
    default: "0"
  output:
    description: Path for the human-readable markdown report.
    required: false
    default: jailbench-report.md
  json:
    description: Path for the machine-readable JSON report.
    required: false
    default: jailbench-report.json
  version:
    description: >-
      Version specifier installed from PyPI, e.g. "==0.1.3". Empty installs the
      latest release.
    required: false
    default: ""
  python-version:
    description: Python version used to run the battery.
    required: false
    default: "3.12"

outputs:
  report:
    description: Path to the markdown report that was written.
    value: ${{ inputs.output }}
  json-report:
    description: Path to the JSON report that was written.
    value: ${{ inputs.json }}

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install hermes-jailbench
      shell: bash
      run: python -m pip install --disable-pip-version-check "hermes-jailbench${{ inputs.version }}"

    - name: Run the battery
      shell: bash
      env:
        # Read from the environment rather than interpolated into the command
        # line, so a key never reaches the runner's process list or the log.
        JAILBENCH_API_KEY: ${{ inputs.api-key }}
        JAILBENCH_MODEL: ${{ inputs.model }}
        JAILBENCH_PROVIDER: ${{ inputs.provider }}
        JAILBENCH_BASE_URL: ${{ inputs.base-url }}
        JAILBENCH_FAIL_ON_BYPASS: ${{ inputs.fail-on-bypass }}
        JAILBENCH_OUTPUT: ${{ inputs.output }}
        JAILBENCH_JSON: ${{ inputs.json }}
      run: |
        set -euo pipefail
        args=(--provider "$JAILBENCH_PROVIDER" --output "$JAILBENCH_OUTPUT" --json "$JAILBENCH_JSON")
        # if-blocks, not `[ -n "$X" ] && ...`: under `set -e` a false test on the
        # last line of the script would end the step with exit 1 and no run.
        if [ -n "$JAILBENCH_MODEL" ]; then args+=(--model "$JAILBENCH_MODEL"); fi
        if [ -n "$JAILBENCH_BASE_URL" ]; then args+=(--base-url "$JAILBENCH_BASE_URL"); fi
        # The key is exported for the CLI to read, never appended to args: an
        # argv entry is visible in the runner's process list to anything else
        # running on the machine, which matters on a self-hosted runner.
        # The CLI reads OPENAI_API_KEY for openai-compat and ANTHROPIC_API_KEY
        # otherwise, so the export matches the selected provider.
        if [ -n "$JAILBENCH_API_KEY" ]; then
          if [ "$JAILBENCH_PROVIDER" = "openai-compat" ]; then
            export OPENAI_API_KEY="$JAILBENCH_API_KEY"
          else
            export ANTHROPIC_API_KEY="$JAILBENCH_API_KEY"
          fi
        fi
        if [ -n "$JAILBENCH_FAIL_ON_BYPASS" ]; then
          args+=(--fail-on-bypass "$JAILBENCH_FAIL_ON_BYPASS")
        fi
        hermes-jailbench "${args[@]}"
