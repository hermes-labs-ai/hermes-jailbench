[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "hermes-jailbench"
version = "0.2.2"
description = "Jailbreak regression benchmark for LLM endpoints with repeatable known-pattern attacks and deterministic scoring"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Rolando Bosch", email = "roli@hermes-labs.ai" }
]
maintainers = [
    { name = "Hermes Labs", email = "roli@hermes-labs.ai" }
]
keywords = ["llm", "jailbreak", "red-team", "safety", "ai-safety", "benchmark", "regression-testing", "prompt-security"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
]
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4.0",
    "mypy>=1.0",
    # Only so tests/test_ci_mode.py can parse action.yml; the package itself
    # reads no YAML and gains no runtime dependency.
    "pyyaml>=6",
]

[project.scripts]
hermes-jailbench = "hermes_jailbench.cli:main"

[project.urls]
Homepage = "https://github.com/hermes-labs-ai/hermes-jailbench"
Documentation = "https://github.com/hermes-labs-ai/hermes-jailbench#readme"
Repository = "https://github.com/hermes-labs-ai/hermes-jailbench"
Issues = "https://github.com/hermes-labs-ai/hermes-jailbench/issues"
Changelog = "https://github.com/hermes-labs-ai/hermes-jailbench/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["hermes_jailbench"]
include = ["hermes_jailbench/py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["hermes_jailbench"]
omit = ["tests/*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
no_strict_optional = true
